<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal and inline css</title>
    <style>
        body{
            background-color: burlywood;
        }
        h1{
            color:brown
        }
        p{
            color:chocolate
        }
    </style>
</head>
<body>
    <h1>Internal CSS</h1>
    <p>This paragraph that contains cascading style sheet</p>
    <h2 style="color: brown;">This is a heading using inline CSS</h2>
</body>
</html>
